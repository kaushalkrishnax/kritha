plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.wakeword'
version = '0.1.0'

android {
  namespace "expo.modules.wakeword"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++14"
      }
    }
  }
  lintOptions {
    abortOnError false
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
}