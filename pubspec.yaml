name: kritha
description: >-
  Kritha — An AI assistant with customizable automations and workflows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Chat rendering: Markdown, fenced code highlighting and LaTeX.
  gpt_markdown: ^1.4.0

  # State management and navigation.
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Local persistence.
  drift: ^2.35.2
  sqlite3: ^3.7.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Networking and filesystem.
  dio: ^5.11.1
  path_provider: ^2.1.6

  # Models and code generation.
  freezed_annotation: ^3.1.0

  # Icons and the proposed on-device audio stack.
  # NOTE: pub.dev's `lucide_icons` stops at 0.257.0 and caps the Dart SDK at
  # <3.0.0, so it cannot resolve on Dart 3.13. `hugeicons` provides the icon set.
  hugeicons: ^1.2.0
  litertlm: ^0.0.14
  sherpa_onnx: ^1.13.8
  record: ^7.1.2
  just_audio: ^0.10.6
  permission_handler: ^13.0.2
  material_ui: ^1.8.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  dart_openai: ^8.0.0
  http: ^1.6.0
  tldts: ^0.0.1-beta

# Xcode 16.2 ships Swift 6.0.3, which rejects the trailing commas emitted by
# shared_preferences_foundation 2.6.0. Pin the last compatible iOS plugin until
# the toolchain is upgraded.
dependency_overrides:
  shared_preferences_foundation: 2.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/kritha_logo.png
    - assets/images/kritha_splash.png
    - assets/images/kritha_splash_android12.png
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#2563EB"
  image: assets/images/kritha_splash.png
  android: true
  ios: true
  android_12:
    color: "#2563EB"
    image: assets/images/kritha_splash_android12.png
