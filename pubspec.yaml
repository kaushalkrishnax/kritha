name: kritha
description: >-
  Kritha — the original on-device AI assistant Flutter application.
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Chat rendering: Markdown, fenced code highlighting and LaTeX.
  gpt_markdown: ^1.4.0

  # State management and navigation.
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Local persistence.
  drift: ^2.35.2
  sqlite3: ^3.7.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Networking and filesystem.
  dio: ^5.11.1
  path_provider: ^2.1.6

  # Models and code generation.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Icons and the proposed on-device audio stack.
  # NOTE: pub.dev's `lucide_icons` stops at 0.257.0 and caps the Dart SDK at
  # <3.0.0, so it cannot resolve on Dart 3.13. `lucide_icons_flutter` is the
  # maintained Dart 3 compatible Lucide package and is used instead.
  lucide_icons_flutter: ^4.0.1
  sherpa_onnx: ^1.13.8
  record: ^7.1.2
  just_audio: ^0.10.6
  permission_handler: ^13.0.2
  material_ui: ^1.8.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1

# Xcode 16.2 ships Swift 6.0.3, which rejects the trailing commas emitted by
# shared_preferences_foundation 2.6.0. Pin the last compatible iOS plugin until
# the toolchain is upgraded.
dependency_overrides:
  shared_preferences_foundation: 2.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/kritha_logo.png
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
